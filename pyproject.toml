[project]
name = "line-integral-convolutions"
version = "2.0.2"
description = "vegtamr: a line integral convolution library"
readme = "README.md"
authors = [
  { name = "Neco Kriel", email = "necokriel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
  "ahe>=0.1.0",
  "matplotlib>=3.10.1",
  "rlic>=0.5.1",
  "scipy>=1.15.2",
]

[dependency-groups]
dev = ["basedpyright>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vegtamr"]

[tool.basedpyright]
include = ["src", "demos"]
reportExplicitAny = "none"
reportAny = "none"
reportImplicitStringConcatenation = "none"
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
reportImportCycles = "none"
